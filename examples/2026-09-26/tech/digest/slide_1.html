<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Tech · slide 1</title>
<style>

:root{
  --paper:#EAEEF3; --ink:#0C1A2B; --muted:#586780; --rule:#C7D0DC; --card:#F7F9FB;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
}
@page{size:1080px 1350px;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;padding:72px 84px 64px}

/* barra di avanzamento: mostra a che punto del carosello sei */
.rail{display:flex;gap:10px;height:8px;margin-bottom:56px}
.rail i{flex:1;border-radius:4px;background:var(--rule)}
.rail i.on{background:var(--accent)}

main{flex:1;min-height:0;display:flex;flex-direction:column}
footer{display:flex;justify-content:space-between;align-items:center;margin-top:36px;padding-top:24px;
  border-top:2px solid var(--rule);font-size:26px;color:var(--muted)}

.fit{overflow:hidden;min-height:0}

/* ---------- cover ---------- */
body.cover{background:var(--accent);color:#fff}
body.cover .rail i{background:rgba(255,255,255,.28)}
body.cover .rail i.on{background:#fff}
body.cover footer{border-color:rgba(255,255,255,.35);color:rgba(255,255,255,.85)}
.cover main{justify-content:flex-end;gap:40px}
.cover .day{font-size:34px;font-weight:600;opacity:.9}
.cover h1{font-family:var(--serif);font-weight:700;font-size:118px;line-height:1.02;letter-spacing:-.02em;
  flex:1;display:flex;align-items:flex-end}
.cover h1 span{display:block;max-height:100%;overflow:hidden}
.cover .label{font-size:38px;font-weight:600}

/* ---------- story ---------- */
.story main{gap:36px}
.story .num{font-family:var(--serif);font-weight:700;font-size:150px;line-height:.8;color:var(--accent)}
.story h2{font-family:var(--serif);font-weight:700;font-size:70px;line-height:1.08;letter-spacing:-.01em;max-height:330px}
.story ul{list-style:none;display:flex;flex-direction:column;gap:22px;flex:1}
.story li{font-size:38px;line-height:1.28;padding-left:30px;border-left:8px solid var(--accent-soft)}
.story .framing{background:var(--accent-soft);border-radius:14px;padding:26px 30px;font-size:31px;line-height:1.3}
.story .framing b{display:block;font-size:26px;color:var(--accent);margin-bottom:6px}
.story .note{font-size:29px;font-style:italic;color:var(--muted)}
.story .by{font-size:28px;color:var(--muted)}

/* ---------- versus ---------- */
.versus h2{font-family:var(--serif);font-size:64px;line-height:1.05;font-weight:700}
.versus .theme{font-size:32px;color:var(--muted);margin:10px 0 40px}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:28px;position:relative}
.card{background:var(--card);border-radius:8px;border-top:14px solid var(--c,var(--accent));padding:30px 30px 26px;
  display:flex;flex-direction:column;gap:18px;min-height:0}
.card .who{font-size:34px;font-weight:700;color:var(--c,var(--accent))}
.card .say{font-size:35px;line-height:1.28;flex:1}
.card .quote{font-family:var(--serif);font-style:italic;font-size:29px;line-height:1.3;color:var(--muted);
  border-left:5px solid var(--rule);padding-left:18px;max-height:180px}
.card .meta{font-size:24px;color:var(--muted)}
.vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:84px;height:84px;border-radius:50%;
  background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:30px}
.banner{margin-top:28px;background:var(--ink);color:#fff;border-radius:10px;padding:26px 32px;font-size:31px;line-height:1.3}
.banner:empty{display:none}

/* ---------- factcheck ---------- */
.factcheck h2{font-family:var(--serif);font-size:64px;font-weight:700;line-height:1.05}
.factcheck .theme{font-size:32px;color:var(--muted);margin:10px 0 40px}
.fc-list{flex:1;display:flex;flex-direction:column;gap:26px;min-height:0}
.fc{background:var(--card);border-left:14px solid var(--accent);border-radius:8px;padding:28px 32px}
.fc b{font-size:30px;color:var(--accent)}
.fc p{font-size:37px;line-height:1.25;margin-top:8px}
.fc small{display:block;margin-top:10px;font-size:24px;color:var(--muted)}
.empty{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--serif);
  font-size:58px;line-height:1.15;color:var(--muted);padding:0 30px}
.factcheck .note{font-size:28px;color:var(--muted);margin-top:28px;line-height:1.3}

/* ---------- fonti ---------- */
.sources h2{font-family:var(--serif);font-size:72px;font-weight:700;margin-bottom:36px}
.src-list{flex:1;display:flex;flex-direction:column;gap:22px;min-height:0;overflow:hidden}
.src{display:flex;gap:22px;align-items:baseline}
.src .n{font-family:var(--serif);font-weight:700;font-size:44px;color:var(--accent);min-width:52px}
.src .h{font-size:31px;line-height:1.2}
.src .by{font-size:25px;color:var(--muted);margin-top:4px}
.sources .note{font-size:27px;color:var(--muted);margin-top:24px}
</style>
</head>
<body class="cover" style="--accent:#E2591B;--accent-soft:#FCE3D6">

<div class="rail"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></div>

<main>

  <div class="day">26 settembre 2026</div>
  <h1><span class="fit" data-fit>IA: dal campo minato legale alla produzione robotica</span></h1>
  <div class="label">Tech</div>


</main>

<footer><span>@iltuoaccount</span><span>Tech</span></footer>

<script>
function fit(){
  document.querySelectorAll('[data-fit]').forEach(function(el){
    var s = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollHeight > el.clientHeight + 1 && s > 20){ s -= 2; el.style.fontSize = s + 'px'; }
  });
}
window.addEventListener('load', function(){ (document.fonts ? document.fonts.ready : Promise.resolve()).then(fit); });
</script>
</body>
</html>
